<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARS Express RM → Tk Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff4d4d, #ff9966);
      background-image: url("BG.jpeg") ;
    background-image: url("BG.jpeg");
        background-size: cover;        /* fill screen */
     background-position: center;   /* center image */
     background-repeat: no-repeat;  /* prevent repeat */
     background-attachment: fixed;  /* smooth effect */

    min-height: 100vh;
    margin: 0;

  color: #fff;
  text-align: center;
  padding: 40px;
      color: #fff;
      text-align: center;
      padding: 40px;
    }

    .box {
      background: rgba(19, 182, 117, 0.477);
      border-radius: 12px;
      padding: 25px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    input {
      padding: 10px;
      width: 80%;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      text-align: center;
    }
    button {
      background-color: #fff;
      color: #ff4d4d;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
    }
    button:hover {
      background-color: #ffe6e6;
    }
    h1 { font-size: 24px; margin-bottom: 10px; }
    .result { font-size: 20px; margin-top: 20px; font-weight: bold; }
    .info { font-size: 14px; margin-top: 15px; color: yellow; }

    .weight-calculator {
      margin-top: 22px;
      padding: 18px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
    }
    .weight-calculator h2 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    .weight-calculator p {
      font-size: 14px;
      margin: 0 0 8px;
    }
    .weight-calculator input {
      box-sizing: border-box;
      width: 90%;
    }
    .weight-result {
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
      min-height: 24px;
    }
    .weight-calculator small {
      display: block;
      margin-top: 8px;
      color: #fff3b0;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1> <span > <img src="logo.jpg" height="100px" width="100px" style="border-radius: 50%;" alt=""> </span> <br> RM → Tk <br> Calculator</h1>
    <p>Exchange rate: <b>1 RM = 32.00 Tk (Currently)</b></p>
    <input type="number" id="rmValue" placeholder="Enter price in RM" />
    <br>
    <button onclick="convert()">Calculate</button>
    <div class="result" id="result"></div>
    <div class="info">  The Price is exclude shipping cost. The weight charge KG/1000 Tk will be applicable. </div>

    <!-- Estimated Weight Charge Calculator -->
    <div class="weight-calculator">
      <h2>Estimated Weight Charge</h2>
      <p>Enter product weight to estimate the shipping charge.</p>
      <input type="number" id="weightValue" placeholder="Enter weight in grams" min="1" step="1" />
      <div class="weight-result" id="weightResult">Estimated charge will appear here.</div>
      <small>Rate: 1 KG = 1,000 Tk</small>
    </div>
  </div>

  <script>
  function convert() {
    const rm = parseFloat(document.getElementById("rmValue").value);
    if (isNaN(rm) || rm <= 0) {
      document.getElementById("result").innerHTML = "Please enter a valid RM amount.";
      return;
    }

    let rate = 1.08; // default
    if (rm <= 50) rate = 1.3;
    else if (rm <= 100) rate = 1.2;
    else if (rm <= 300) rate = 1.15;
    else if (rm <= 600) rate = 1.12;
    else if (rm <= 1500) rate = 1.1;
    else if (rm <= 13000) rate = 1.1;
    else if (rm <= 20000) rate = 1.08;

    const tk = rm * 32.00 * rate;
    document.getElementById("result").innerHTML = `💵 Price: <b>${tk.toFixed(2)} Tk + Weight Charge </b>`;
  }

  // Estimate weight charge (1 KG = 1,000 Tk)
  function calculateWeightCharge() {
    const grams = parseFloat(document.getElementById("weightValue").value);
    const output = document.getElementById("weightResult");

    if (isNaN(grams) || grams <= 0) {
      output.textContent = "Please enter a valid weight in grams.";
      return;
    }

    const charge = (grams / 1000) * 1000;
    output.textContent = `Estimated Weight Charge: ${charge.toLocaleString("en-BD", {
      maximumFractionDigits: 2
    })} Tk`;
  }

  // Update estimate as the customer types
  document.getElementById("weightValue").addEventListener("input", calculateWeightCharge);

  // Press Enter to calculate
  document.getElementById("rmValue").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      convert();
    }
  });
</script>

</body>

</html>
